<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <title>
        {{ role }} Login - {{ demo.organization.name }}
    </title>
</head>

<body>

    <h1>{{ demo.organization.name }}</h1>

    <p>
        {{ demo.organization.tagline }}
    </p>

    <h2>{{ role }} Login</h2>

    {% if error_message %}
        <p style="color: red;">
            {{ error_message }}
        </p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <p>
            <label for="{{ form.username.id_for_label }}">
                Username
            </label>

            {{ form.username }}
        </p>

        <p>
            <label for="{{ form.password.id_for_label }}">
                Password
            </label>

            {{ form.password }}
        </p>

        <button type="submit">
            Sign in
        </button>

    </form>

    <p>
        <a href="{% url 'demo-home' %}">
            Back to role selection
        </a>
    </p>

</body>

</html>
